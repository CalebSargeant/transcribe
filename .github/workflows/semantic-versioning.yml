name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  semantic-release:
    uses: CalebSargeant/reusable-workflows/.github/workflows/semantic-release.yaml@d73e91236c0c99d696d6d62b5ed1b052f1771ba8 # first commit when it was introduced - no versioning as of yet
    with:
      bump: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || '' }}
      working_directory: '.'
    secrets:
      APP_ID: ${{ secrets.RELEASE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      id-token: write

  build:
    name: Build binary on ${{ matrix.runner }} (${{ matrix.arch }})
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS-only tool. macos-13 (the last Intel runner) is deprecated/removed,
        # so we build on the two current Apple-Silicon runners. Both are arm64; the
        # macos-15 build is the published release asset, macos-14 is kept as a
        # backwards-compat build so we catch macOS-version regressions before users.
        include:
          - runner: macos-15
            arch: arm64
            artifact_name: transcribe-macos-arm64
            publish: 'true'
          - runner: macos-14
            arch: arm64
            artifact_name: transcribe-macos-arm64-macos14
            publish: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build executable
        run: |
          uv run pyinstaller --clean transcribe.spec

      - name: Rename executable
        run: |
          mv dist/transcribe dist/${{ matrix.artifact_name }}

      - name: Make executable
        run: |
          chmod +x dist/${{ matrix.artifact_name }}

      - name: Test executable
        run: |
          dist/${{ matrix.artifact_name }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  upload:
    name: Upload binaries to release
    needs: [semantic-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: transcribe-macos-arm64
          path: dist

      - name: Display structure
        run: ls -R dist

      - name: Calculate SHA256 checksums
        run: |
          cd dist
          for file in transcribe-*; do
            sha256sum "$file" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Upload binaries to release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ needs.semantic-release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/transcribe-macos-arm64
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Event-driven Homebrew bump (mirrors MagmaMoose/chargate's release.yaml): when a
  # stable release is cut, open a PR on the tap bumping the transcribe formula to the
  # new tag (url + sha256 recomputed). Replaces the old bespoke job that dispatched
  # the tap's update-sha256 workflow. Requires HOMEBREW_TAP_TOKEN — a fine-grained PAT
  # on MagmaMoose/homebrew-tap with Contents + Pull requests: write.
  bump-homebrew:
    name: Bump Homebrew tap formula
    needs: [semantic-release, build, upload]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # Homebrew 6.x refuses to load formulae from untrusted third-party taps when
      # HOMEBREW_REQUIRE_TAP_TRUST is set (it is, on the runner). dawidd6 *clones* the
      # tap, so trust it by name before the bump or `brew bump-formula-pr` aborts with
      # Homebrew::UntrustedTapError.
      - name: Trust the MagmaMoose tap
        run: brew trust --tap magmamoose/tap
      - name: Bump transcribe formula in the tap
        uses: dawidd6/action-homebrew-bump-formula@1446dca236b0440c6f02723a3f14f13be2c04ab0 # v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: MagmaMoose/homebrew-tap
          formula: transcribe
          tag: ${{ needs.semantic-release.outputs.tag }}
          no_fork: true   # push the bump branch straight to the tap (don't fork)
